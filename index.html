<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบใบเบิกพัสดุ - Pharmacy Material System</title>
    <!-- Google Fonts Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้าไฟล์ สไตล์ CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 📌 แถบเมนูลักด้านบน (Navbar) -->
    <div class="navbar no-print">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 1.5rem;">💊</span>
            <strong style="font-size: 1.1rem; color: #2c3e50;">Pharmacy Material System</strong>
        </div>
        <div style="font-size: 0.9rem; color: #7f8c8d; font-weight: 500;">
            RxBUU . Firebase Edition
        </div>
    </div>

    <!-- 📌 กล่องควบคุมเนื้อหาหลัก (App Container) -->
    <div class="app-container">

        <!-- 🔑 1. ส่วนเข้าสู่ระบบ (Login Section) -->
        <div id="loginSection" class="card" style="max-width: 450px; margin: 40px auto; text-align: center; padding: 40px 20px;">
            <div style="font-size: 3rem; margin-bottom: 10px;">🔐</div>
            <h2 style="margin-bottom: 8px; color: #2c3e50;">เข้าสู่ระบบเบิกพัสดุ</h2>
            <p style="color: #7f8c8d; font-size: 0.9rem; margin-bottom: 25px;">
                กรุณาเข้าสู่ระบบด้วย Google Account เพื่อยืนยันตัวตนก่อนเข้าใช้งานระบบ
            </p>
            
            <button type="button" class="btn-login-google" onclick="loginWithGoogle()" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem; cursor: pointer;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" style="width:18px; height:18px; margin-right:8px; vertical-align:middle;">
                เข้าใช้งานด้วย Google
            </button>
            
            <div id="loginStatus" style="margin-top: 15px; font-size: 0.85rem; color: #e67e22; font-weight: 500;"></div>
            <div id="authAlert" style="display: none; margin-top: 15px; padding: 10px; background-color: #fce4e4; border: 1px solid #f9b2b2; border-radius: 6px; color: #c0392b; font-size: 0.85rem;"></div>
        </div>

        <!-- 📝 2. ส่วนฟอร์มบันทึกข้อมูล (Form Section - จะโหลด form.html มาแทรก) -->
        <div id="formSection" class="hidden"></div>

        <!-- 📄 3. ส่วนแสดงผลพรีวิวใบเบิก (Preview Section - จะโหลด preview.html มาแทรก) -->
        <div id="previewSection" class="hidden"></div>

    </div>

    <!-- ⏳ หน้าต่างแสดงการกำลังส่งข้อมูล (Loading Overlay) -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <div style="margin-top: 15px; font-weight: 500; color: #2c3e50;">กำลังบันทึกข้อมูล กรุณารอสักครู่...</div>
    </div>

    <!-- ✨ หน้าต่างแจ้งเตือนบันทึกสำเร็จ (Popup รูปที่ 2) -->
<div id="successPopup" class="popup-hidden hidden">
    <div class="popup-card" style="text-align: center; padding: 30px; background: white; border-radius: 16px; max-width: 380px; margin: auto;">
        <div style="font-size: 2rem; margin-bottom: 10px;">✨</div>
        <h3 style="margin-bottom: 20px; color: #2c3e50; font-size: 1.3rem;">บันทึกข้อมูลเรียบร้อย!</h3>
        
        <button type="button" class="btn-primary" onclick="closePopupAndGoToPrint()" 
                style="width: 100%; padding: 12px; background-color: #d4edda; color: #155724; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s;">
            เปิดหน้าพรีวิวเพื่อสั่งพิมพ์
        </button>
    </div>
</div>

    <!-- 📁 หน้าต่าง Drive Modal สำหรับดูรูปภาพรายการพัสดุ -->
    <div id="driveModal" class="no-print" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
        <div style="background: white; width: 85%; height: 85%; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
            <div style="padding: 12px 20px; background: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 500;">📁 สมุดภาพรายการพัสดุ</span>
                <button type="button" onclick="closeDriveModal()" style="background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer;">✕</button>
            </div>
            <iframe id="driveIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

    <!-- ⚙️ ลิงก์เชื่อมโยงไปยังไฟล์ script.js (แบบ ES Module สำหรับ Firebase) -->
    <script type="module" src="script.js"></script>

</body>
</html>

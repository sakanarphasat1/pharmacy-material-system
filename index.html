<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบใบเบิกวัสดุ - คณะเภสัชศาสตร์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- 🎨 เชื่อมต่อสไตล์ CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <h2>💊 Pharmacy Material System</h2>
        <span>RxBUU . Firebase Edition</span>
    </div>

    <div class="container">
        <!-- 🔑 การ์ดเข้าสู่ระบบ -->
        <div id="loginSection" class="card login-card">
            <h3 style="color: #003366; margin-bottom: 10px;">🔒 เข้าสู่ระบบเบิกพัสดุ</h3>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">กรุณาลงชื่อเข้าใช้ด้วย Google Account เพื่อยืนยันตัวตนด้วยรหัสผ่าน</p>

            <button class="btn-google" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                ลงชื่อเข้าใช้ด้วย Google
            </button>

            <p id="loginStatus" style="margin-top: 15px; color: #555; font-size: 0.9rem;"></p>
            <div id="authAlert" class="alert-box"></div>
        </div>

        <!-- 📝 พื้นที่โหลด Form.html มาใส่หลังจากล็อกอินสำเร็จ -->
        <div id="formSection" class="hidden"></div>
    </div>

    <!-- ⚙️ เชื่อมต่อไฟล์สคริปต์หลัก -->
    <script type="module" src="script.js"></script>
</body>
</html>

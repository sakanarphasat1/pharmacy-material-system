<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบใบเบิกวัสดุ - คณะเภสัชศาสตร์</title>
    
    <!-- 🔤 Google Fonts (Prompt & TH Sarabun New) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=TH+Sarabun+New:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- 🎨 ลิงก์เชื่อมโยงไปยังไฟล์ style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 📌 แถบเมนูหลักด้านบน -->
    <div class="navbar no-print">
        <div class="nav-container">
            <span class="nav-logo">💊 Pharmacy Material System</span>
            <span class="nav-status">RxBUU . Firebase Edition</span>
        </div>
    </div>

    <div class="app-container">
        
        <!-- 🔑 1. หน้าต่างล็อกอินผ่าน Firebase Authentication -->
        <div id="loginSection" class="card login-card no-print">
            <h3 style="color: #003366; margin-bottom: 10px;">🔒 เข้าสู่ระบบเบิกพัสดุ</h3>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">
                กรุณาลงชื่อเข้าใช้ด้วย Google Account เพื่อยืนยันตัวตนก่อนใช้งานระบบ
            </p>

            <button class="btn-google" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                ลงชื่อเข้าใช้ด้วย Google
            </button>

            <p id="loginStatus" style="margin-top: 15px; color: #555; font-size: 0.9rem;"></p>
            <div id="authAlert" class="alert-box"></div>
        </div>

        <!-- 📝 2. พื้นที่แสดงฟอร์มขอเบิก (จะถูกโหลดมาจาก Form.html หลังล็อกอิน) -->
        <div id="formSection" class="view-section hidden no-print"></div>
        
        <!-- 📄 3. พื้นที่แสดงพรีวิวเอกสารพิมพ์ (จะถูกโหลดมาจาก Preview.html หลังกรอกฟอร์ม) -->
        <div id="previewSection" class="view-section hidden"></div>
        
    </div>

    <!-- ⏳ หน้าต่างแสดงการกำลังโหลด -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>กำลังบันทึกใบเบิกวัสดุ...</p>
    </div>

    <!-- ✨ หน้าต่างแจ้งเตือนบันทึกสำเร็จ -->
    <div id="successPopup" class="popup hidden">
        <div class="popup-content">
            <h2 style="font-weight: normal; margin-bottom: 20px;">✨ บันทึกข้อมูลเรียบร้อย!</h2>
            <button class="btn btn-success" style="width: 100%;" onclick="closePopup()">เปิดหน้าพรีวิวเพื่อสั่งพิมพ์</button>
        </div>
    </div>

    <!-- 📁 หน้าต่าง Drive Modal สำหรับดูรูปภาพรายการพัสดุ -->
    <div id="driveModal" class="no-print" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
        <div style="background-color: white; width: 85%; height: 85%; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
            <div style="padding: 12px 20px; background-color: #003366; color: white; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold; font-size: 1rem;">📁 รูปภาพรายการพัสดุ</span>
                <button type="button" onclick="closeDriveModal()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; font-weight: bold;">&times;</button>
            </div>
            <div style="flex: 1; width: 100%; height: 100%;">
                <iframe id="driveIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>

    <!-- ⚙️ ลิงก์เชื่อมโยงไปยังไฟล์ script.js (ใช้แบบ ES Module สำหรับ Firebase) -->
    <script type="module" src="script.js"></script>

</body>
</html>
